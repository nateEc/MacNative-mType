name: Native Rewrite Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-rewrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-rewrite:
    name: Verify native rewrite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Typebar
        uses: actions/checkout@v6

      - name: Check out the pinned Monkeytype reference
        id: reference
        shell: bash
        run: |
          set -euo pipefail
          reference_directory="$(mktemp -d "${RUNNER_TEMP}/monkeytype-reference.XXXXXX")"
          git init --quiet "$reference_directory"
          git -C "$reference_directory" remote add origin https://github.com/monkeytypegame/monkeytype.git
          git -C "$reference_directory" fetch --depth=1 origin 91bd24bb8513785c7364cbea29296ff7adafac41
          git -C "$reference_directory" checkout --quiet --detach FETCH_HEAD
          printf 'path=%s\n' "$reference_directory" >> "$GITHUB_OUTPUT"

      - name: Verify source, resource, and reference boundaries
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"
            shift
            if ! "$@"; then
              printf '::error title=Native rewrite gate failed::%s failed\n' "$label"
              exit 1
            fi
          }
          run_check "originality self-test" zsh Scripts/check-originality-boundaries.sh --self-test
          run_check "originality reference scan" zsh Scripts/check-originality-boundaries.sh --reference "${{ steps.reference.outputs.path }}"
          run_check "page and modal audit" zsh Scripts/check-page-modal-surface-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "working-tree whitespace check" git diff --check

      - name: Verify no Typebar app is already running
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' "Typebar must not be launched by the verification workflow" >&2
            exit 1
          fi

      - name: Run native client tests without launching the app
        shell: bash
        run: |
          set -euo pipefail
          TYPEBAR_QA_IN_MEMORY_STORE=1 swift test
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' "Typebar was unexpectedly launched by the test suite" >&2
            exit 1
          fi

      - name: Verify the signed macOS app bundle without launching it
        shell: bash
        run: zsh Scripts/check-macos-app-package.sh

      - name: Run self-hosted service tests
        shell: bash
        run: swift test --package-path server
