name: Native Rewrite Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-rewrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-rewrite:
    name: Verify native rewrite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Typebar
        uses: actions/checkout@v6

      - name: Check out the pinned Monkeytype reference
        id: reference
        shell: bash
        run: |
          set -euo pipefail
          reference_directory="$(mktemp -d "${RUNNER_TEMP}/monkeytype-reference.XXXXXX")"
          git init --quiet "$reference_directory"
          git -C "$reference_directory" remote add origin https://github.com/monkeytypegame/monkeytype.git
          git -C "$reference_directory" fetch --depth=1 origin 91bd24bb8513785c7364cbea29296ff7adafac41
          git -C "$reference_directory" checkout --quiet --detach FETCH_HEAD
          printf 'path=%s\n' "$reference_directory" >> "$GITHUB_OUTPUT"

      - name: Verify source, resource, and reference boundaries
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"
            shift
            if ! "$@"; then
              printf '::error title=Native rewrite gate failed::%s failed\n' "$label"
              exit 1
            fi
          }
          run_check "originality self-test" zsh Scripts/check-originality-boundaries.sh --self-test
          run_check "originality reference scan" zsh Scripts/check-originality-boundaries.sh --reference "${{ steps.reference.outputs.path }}"
          run_check "reference metadata audit" zsh Scripts/check-reference-metadata-audits.sh "${{ steps.reference.outputs.path }}"
          run_check "service surface audit" zsh Scripts/check-reference-service-surface-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "service-behavior alignment audit self-test" zsh Scripts/check-reference-service-behavior-alignment.sh --self-test
          run_check "service-behavior alignment audit" zsh Scripts/check-reference-service-behavior-alignment.sh "${{ steps.reference.outputs.path }}"
          run_check "page and modal audit" zsh Scripts/check-page-modal-surface-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "reference behavior audit" zsh Scripts/check-reference-behavior-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "manual acceptance audit self-test" ruby Scripts/check-manual-acceptance-audit.rb --self-test
          run_check "manual acceptance audit" ruby Scripts/check-manual-acceptance-audit.rb
          run_check "working-tree whitespace check" git diff --check

      - name: Verify no Typebar app is already running
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' "Typebar must not be launched by the verification workflow" >&2
            exit 1
          fi

      - name: Run native client tests without launching the app
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp "${RUNNER_TEMP}/typebar-client-tests.XXXXXX.log")"
          test_status=0
          TYPEBAR_QA_IN_MEMORY_STORE=1 swift test >"$test_log" 2>&1 || test_status=$?
          cat "$test_log"
          if [[ "$test_status" -ne 0 ]]; then
            xctest_failures="$(grep -E 'Test Case .+ (failed|threw an error)' "$test_log" | tail -n 5 || true)"
            if [[ -n "$xctest_failures" ]]; then
              diagnosis="$xctest_failures"
            else
              diagnosis="$(tail -n 30 "$test_log")"
            fi
            diagnosis="$(printf '%s' "$diagnosis" | tr '\n' ' ' | tail -c 1200)"
            printf '::error title=Native client test failed::swift test exited %s; %s\n' "$test_status" "$diagnosis"
            exit "$test_status"
          fi
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' '::error title=Native app launch detected::Typebar was unexpectedly launched by the client test suite'
            printf '%s\n' "Typebar was unexpectedly launched by the test suite" >&2
            exit 1
          fi

      - name: Verify the signed macOS app bundle without launching it
        shell: bash
        run: zsh Scripts/check-macos-app-package.sh --reference "${{ steps.reference.outputs.path }}"

      - name: Run self-hosted service tests
        shell: bash
        run: swift test --package-path server
