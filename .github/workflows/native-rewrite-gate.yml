name: Native Rewrite Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-rewrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-rewrite:
    name: Verify native rewrite
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    # The complete client suite alone took 39 minutes on a local Apple Silicon host.
    timeout-minutes: 90

    steps:
      - name: Check out Typebar
        uses: actions/checkout@v6

      - name: Verify pinned Xcode and motion environment
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Fxq 'Xcode 26.3' <<< "$xcode_version"
          swift --version
          swift -e 'import AppKit; print("system reduce motion:", NSWorkspace.shared.accessibilityDisplayShouldReduceMotion)'

      - name: Set up Go for native code-practice compilation tests
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - name: Verify Go toolchain
        run: go version

      - name: Prepare pinned Node QA runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify Unicode version for source text probes
        run: node -e 'require("node:assert/strict").equal(process.versions.unicode, "17.0"); console.log(process.version, process.versions.unicode)'

      - name: Check out the pinned Monkeytype reference
        id: reference
        shell: bash
        run: |
          set -euo pipefail
          reference_directory="$(mktemp -d "${RUNNER_TEMP}/monkeytype-reference.XXXXXX")"
          git init --quiet "$reference_directory"
          git -C "$reference_directory" remote add origin https://github.com/monkeytypegame/monkeytype.git
          git -C "$reference_directory" fetch --depth=1 origin 91bd24bb8513785c7364cbea29296ff7adafac41
          git -C "$reference_directory" checkout --quiet --detach FETCH_HEAD
          printf 'path=%s\n' "$reference_directory" >> "$GITHUB_OUTPUT"

      - name: Verify source, resource, and reference boundaries
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"
            shift
            if ! "$@"; then
              printf '::error title=Native rewrite gate failed::%s failed\n' "$label"
              exit 1
            fi
          }
          run_check "originality self-test" zsh Scripts/check-originality-boundaries.sh --self-test
          run_check "originality reference scan" zsh Scripts/check-originality-boundaries.sh --reference "${{ steps.reference.outputs.path }}"
          run_check "reference metadata audit" zsh Scripts/check-reference-metadata-audits.sh "${{ steps.reference.outputs.path }}"
          run_check "service surface audit" zsh Scripts/check-reference-service-surface-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "service-behavior alignment audit self-test" zsh Scripts/check-reference-service-behavior-alignment.sh --self-test
          run_check "service-behavior alignment audit" zsh Scripts/check-reference-service-behavior-alignment.sh "${{ steps.reference.outputs.path }}"
          run_check "page and modal audit" zsh Scripts/check-page-modal-surface-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "reference behavior audit" zsh Scripts/check-reference-behavior-audit.sh "${{ steps.reference.outputs.path }}"
          run_check "manual acceptance audit self-test" ruby Scripts/check-manual-acceptance-audit.rb --self-test
          run_check "manual acceptance audit" ruby Scripts/check-manual-acceptance-audit.rb
          run_check "English corpus preparation contracts" python3 Scripts/test-english-frequency-corpus.py
          run_check "bundled English corpus integrity" python3 Scripts/prepare-english-frequency-corpus.py --output-root . --check-bundled
          run_check "large English preparation contracts" python3 Scripts/prepare-english-large-corpus.py --self-test
          run_check "large English optimized preparation contracts" python3 -O Scripts/prepare-english-large-corpus.py --self-test
          run_check "bundled large English corpus integrity" python3 Scripts/prepare-english-large-corpus.py --output-root . --check-bundled
          run_check "German corpus preparation contracts" python3 Scripts/prepare-german-frequency-corpus.py --self-test
          run_check "German optimized preparation contracts" python3 -O Scripts/prepare-german-frequency-corpus.py --self-test
          run_check "bundled German corpus integrity" python3 Scripts/prepare-german-frequency-corpus.py --check-bundled
          run_check "large French preparation contracts" python3 Scripts/prepare-french-large-corpus.py --self-test
          run_check "large French optimized preparation contracts" python3 -O Scripts/prepare-french-large-corpus.py --self-test
          run_check "bundled large French integrity" python3 Scripts/prepare-french-large-corpus.py --check-bundled
          run_check "Spanish corpus preparation contracts" python3 Scripts/test-spanish-frequency-corpus.py
          run_check "bundled Spanish corpus integrity" python3 Scripts/prepare-spanish-frequency-corpus.py --output-root . --check-bundled
          run_check "French corpus preparation contracts" python3 Scripts/test-french-frequency-corpus.py
          run_check "bundled French corpus integrity" python3 Scripts/prepare-french-frequency-corpus.py --output-root . --check-bundled
          run_check "Italian corpus preparation contracts" python3 Scripts/test-italian-frequency-corpus.py
          run_check "bundled Italian corpus integrity" python3 Scripts/prepare-italian-frequency-corpus.py --output-root . --check-bundled
          run_check "Western vocabulary audit contracts" python3 Scripts/test-western-basic-corpora.py
          run_check "Western vocabulary integrity" python3 Scripts/check-western-basic-corpora.py
          run_check "working-tree whitespace check" git diff --check

      - name: Verify no Typebar app is already running
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' "Typebar must not be launched by the verification workflow" >&2
            exit 1
          fi

      - name: Prepare pinned website source QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          schema_qa_root="$(zsh Scripts/prepare-website-config-schema-qa.sh)"
          animation_qa_archive="$(zsh Scripts/prepare-animation-engine-qa.sh)"
          keymap_reactivity_qa_archive="$(zsh Scripts/prepare-keymap-reactivity-qa.sh)"
          printf 'TYPEBAR_WEBSITE_CONFIG_ZOD_ROOT=%s\n' "$schema_qa_root" >> "$GITHUB_ENV"
          printf 'TYPEBAR_WEBSITE_CONFIG_REFERENCE_ROOT=%s\n' "${{ steps.reference.outputs.path }}" >> "$GITHUB_ENV"
          printf 'TYPEBAR_LINE_SCROLL_ANIME_ARCHIVE=%s\n' "$animation_qa_archive" >> "$GITHUB_ENV"
          printf 'TYPEBAR_SOLID_QA_ARCHIVE=%s\n' "$keymap_reactivity_qa_archive" >> "$GITHUB_ENV"

      - name: Verify animation QA preparation failure boundaries
        run: python3 Scripts/test-animation-engine-qa.py

      - name: Verify keymap reactivity QA preparation failure boundaries
        run: python3 Scripts/test-keymap-reactivity-qa.py

      - name: Prepare remaining pinned source QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          source_qa_root="$(mktemp -d "${RUNNER_TEMP}/typebar-source-parity.XXXXXX")"
          npm install --prefix "$source_qa_root/libraries" --ignore-scripts --no-save --package-lock=false --no-fund --no-audit \
            date-fns@3.6.0 @date-fns/utc@1.2.0 lz-ts@1.1.2 @tanstack/db@0.6.8
          npm pack --ignore-scripts --pack-destination "$source_qa_root" howler@2.2.3
          npm pack --ignore-scripts --pack-destination "$source_qa_root" chartjs-plugin-trendline@3.2.4
          npm pack --ignore-scripts --pack-destination "$source_qa_root" throttle-debounce@5.0.2
          npm pack --ignore-scripts --pack-destination "$source_qa_root" hangul-js@0.2.6
          printf 'TYPEBAR_REFERENCE_ROOT=%s\n' "${{ steps.reference.outputs.path }}" >> "$GITHUB_ENV"
          printf 'TYPEBAR_PRACTICE_SOURCE_DEPENDENCIES=%s\n' "$source_qa_root/libraries" >> "$GITHUB_ENV"
          printf 'TYPEBAR_CONFIG_LINK_SOURCE_DEPENDENCIES=%s\n' "$source_qa_root/libraries" >> "$GITHUB_ENV"
          printf 'TYPEBAR_INBOX_SOURCE_PACKAGE=%s\n' "$source_qa_root/libraries/node_modules/@tanstack/db" >> "$GITHUB_ENV"
          printf 'TYPEBAR_HOWLER_SOURCE_ARCHIVE=%s\n' "$source_qa_root/howler-2.2.3.tgz" >> "$GITHUB_ENV"
          printf 'TYPEBAR_DAILY_TREND_SOURCE_ARCHIVE=%s\n' "$source_qa_root/chartjs-plugin-trendline-3.2.4.tgz" >> "$GITHUB_ENV"
          printf 'TYPEBAR_THEME_DEBOUNCE_ARCHIVE=%s\n' "$source_qa_root/throttle-debounce-5.0.2.tgz" >> "$GITHUB_ENV"
          printf 'TYPEBAR_REPLAY_HANGUL_ARCHIVE=%s\n' "$source_qa_root/hangul-js-0.2.6.tgz" >> "$GITHUB_ENV"

      - name: Verify pinned source QA evidence failure boundaries
        run: python3 Scripts/test-source-qa-evidence.py

      - name: Run native client tests without launching the app
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp "${RUNNER_TEMP}/typebar-client-tests.XXXXXX.log")"
          test_status=0
          env \
            TYPEBAR_QA_IN_MEMORY_STORE=1 \
            TYPEBAR_LAYOUT_AUDIT_REFERENCE="${{ steps.reference.outputs.path }}" \
            TYPEBAR_LAYOUT_AUDIT_ALL_LAYERS=1 \
            TYPEBAR_LAYOUT_GUIDE_AUDIT_REFERENCE="${{ steps.reference.outputs.path }}" \
            swift test >"$test_log" 2>&1 || test_status=$?
          cat "$test_log"
          if [[ "$test_status" -ne 0 ]]; then
            xctest_failures="$(grep -E 'Test Case .+ (failed|threw an error)' "$test_log" | tail -n 5 || true)"
            compiler_failure="$(grep -m 1 -E '^[^[:space:]]+:[0-9]+:[0-9]+: error:' "$test_log" || true)"
            if [[ -n "$xctest_failures" ]]; then
              diagnosis="$xctest_failures"
            elif [[ -n "$compiler_failure" ]]; then
              diagnosis="$compiler_failure"
            else
              diagnosis="$(tail -n 30 "$test_log")"
            fi
            diagnosis="$(printf '%s' "$diagnosis" | tr '\n' ' ' | tail -c 1200)"
            printf '::error title=Native client test failed::swift test exited %s; %s\n' "$test_status" "$diagnosis"
            exit "$test_status"
          fi
          if ! python3 Scripts/check-source-qa-evidence.py "$test_log"; then
            printf '%s\n' '::error title=Missing pinned source QA evidence::Required source comparisons were skipped, missing, duplicated, or failed'
            exit 1
          fi
          if pgrep -x Typebar >/dev/null; then
            printf '%s\n' '::error title=Native app launch detected::Typebar was unexpectedly launched by the client test suite'
            printf '%s\n' "Typebar was unexpectedly launched by the test suite" >&2
            exit 1
          fi

      - name: Verify the signed macOS app bundle without launching it
        shell: bash
        run: zsh Scripts/check-macos-app-package.sh --reference "${{ steps.reference.outputs.path }}"

      - name: Run self-hosted service tests
        shell: bash
        run: swift test --package-path server
